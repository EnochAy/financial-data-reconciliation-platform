version: 2

models:
  - name: stg_entity
    description: Organisations whose payroll is processed (synthetic).
    columns:
      - name: entity_id
        data_tests:
          - unique
          - not_null

  - name: stg_employee
    description: One row per employee, with a masked bank reference.
    columns:
      - name: employee_id
        data_tests:
          - unique
          - not_null
      - name: entity_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_entity')
                field: entity_id

  - name: stg_payroll_run
    description: One payroll run per entity per period.
    columns:
      - name: payroll_run_id
        data_tests:
          - unique
          - not_null
      - name: entity_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_entity')
                field: entity_id

  - name: stg_payroll_line
    description: What payroll says each employee should be paid in a run.
    columns:
      - name: line_id
        data_tests:
          - unique
          - not_null
      - name: payroll_run_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payroll_run')
                field: payroll_run_id
      - name: employee_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_employee')
                field: employee_id

  - name: stg_disbursement
    description: Payments sent, one row per disbursement instruction.
    columns:
      - name: disbursement_id
        data_tests:
          - unique
          - not_null
      - name: line_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_payroll_line')
                field: line_id

  - name: stg_bank_txn
    description: Bank settlement records. Orphans have no disbursement_id.
    columns:
      - name: txn_id
        data_tests:
          - unique
          - not_null
      - name: disbursement_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_disbursement')
                field: disbursement_id
      - name: txn_status
        data_tests:
          - accepted_values:
              arguments:
                values: ['settled', 'failed']
